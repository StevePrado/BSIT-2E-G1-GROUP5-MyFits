<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Fits - Closet</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #f8f9fa;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-bg {
            font-size: 6rem;
            font-weight: 700;
            color: #000;
            opacity: 0.03;
            letter-spacing: 5px;
            user-select: none;
        }

        /* The exact Floating Button Design from your image */
        .floating-create-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background-color: #000;
            color: #fff;
            border: none;
            padding: 14px 35px;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .floating-create-btn span {
            border-bottom: 2px solid #fff; /* Matches the underline in your image */
        }

        .floating-create-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>

    <div class="brand-bg">MY FITS</div>

    <button class="floating-create-btn" onclick="window.location.href='Creating.html'">
        <span>+ Create</span>
    </button>

</body>
</html>
